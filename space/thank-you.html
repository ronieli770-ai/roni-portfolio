<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>יצאנו לדרך | סטודיו רוני</title>
<link rel="canonical" href="https://www.ronieliyahu.co.il/thank-you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;touch-action:manipulation}
  body{
    background:#000;color:#fff;overflow:hidden;
    font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }

  /* the moon surface fills the frame, its horizon held to the lower half the
     way the design frames it */
  .moon{
    position:fixed;inset:0;z-index:0;
    /* the picture spans the width and sits on the bottom edge, so the horizon
       lands where the design puts it whatever shape the window is. cover would
       crop the top on a wide, short screen and push the horizon up into the
       copy. above it is black, which is the design's sky. */
    background:#000 url(/space/assets/thanks-moon.webp) center bottom/100% auto no-repeat;
  }
  /* the design's sky is pure black at the top; this keeps it that way on a
     screen taller than the picture */
  .sky{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.82) 34%,rgba(0,0,0,.52) 50%,rgba(0,0,0,.18) 60%,rgba(0,0,0,0) 70%);
  }

  .logo{position:fixed;left:2.14vw;top:2.55vw;width:min(170px,9.84vw);z-index:5}
  .logo img{width:100%;display:block}

  main{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:12.8vh 5vw 0;
  }

  .kicker,.title{
    margin:0;background:linear-gradient(to right,#8da8cb,#ffffff);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    /* clipping the gradient to the letters clips their box too, so a tight
       line leaves the tail of a ך outside it. the room below is deliberate. */
    padding-bottom:.14em;
  }
  /* "אני הטייסת שלכם להיום", pane 4 */
  .kicker{font-size:min(45px,2.6vw);font-weight:300;line-height:1}
  /* "רוני אליהו", pane 4 */
  .title{font-size:min(120px,6.94vw);font-weight:700;line-height:.88;margin-top:.02em}

  .note{
    margin:min(14px,.81vw) 0 0;color:#fff;font-weight:400;
    font-size:min(18px,1.04vw);line-height:1.35;max-width:min(541px,31.3vw);
  }

  /* the pair the hero opens with: 160 by 58, radius 10, 20px semibold */
  .cta{
    display:flex;gap:14px;margin-top:min(34px,1.97vw);
    flex-direction:row-reverse;                 /* the solid one sits to the right */
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    width:160px;height:58px;border-radius:10px;
    font-size:20px;font-weight:600;text-decoration:none;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s,background .3s;
  }
  .btn.solid{color:#fff;background:linear-gradient(to left,#e0783c,#fa9154)}
  .btn.line{color:#fa9154;border:1px solid #e0783c}
  .btn .ic{
    width:1.05em;height:1.05em;flex:none;background:currentColor;
    -webkit-mask:url(/space/assets/ct-wa.svg) center/contain no-repeat;
    mask:url(/space/assets/ct-wa.svg) center/contain no-repeat;
  }
  @media (hover:hover){
    .btn.solid:hover{filter:brightness(1.08);transform:translateY(-2px)}
    .btn.line:hover{background:rgba(224,120,60,.12);transform:translateY(-2px)}
  }

  /* the entrance, once */
  main > *{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
  .kicker{animation-delay:.05s}
  .title{animation-delay:.13s}
  .note{animation-delay:.23s}
  .cta{animation-delay:.31s}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  @media (max-width:768px),(hover:none) and (pointer:coarse) and (max-width:1024px){
    .logo{left:14px;top:18px;width:118px}
    /* a portrait screen needs the moon taller than its natural band */
    /* a portrait screen needs the moon taller than its natural band, and close
       enough under the copy that the middle is not a stretch of empty black */
    .moon{background-position:center bottom;background-size:auto 58%}
    .sky{background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 26%,rgba(0,0,0,0) 52%)}
    main{padding:17vh 22px 0}
    /* the same three from pane 4 at their phone sizes */
    .kicker{font-size:22px}
    .title{font-size:58px;margin-top:.02em}
    .note{font-size:16px;line-height:1.5;max-width:30ch;margin-top:10px}
    /* side by side, at the size the hero's pair takes on a phone */
    .cta{flex-direction:row-reverse;width:auto;gap:14px;margin-top:24px}
    .btn{width:136px;height:56px;font-size:17px;border-radius:10px}
  }
  /* a short landscape phone: keep the copy off the horizon */
  @media (max-height:520px) and (orientation:landscape){
    main{padding-top:8vh}
    .kicker{font-size:22px}
    .title{font-size:38px}
    .note{font-size:14px;margin-top:12px}
    .cta{margin-top:16px}
    .btn{height:46px;font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    main > *{animation:none!important}
  }
</style>
</head>
<body>
  <div class="moon"></div>
  <div class="sky"></div>
  <a class="logo" href="/"><img src="/space/assets/logo.webp" alt="סטודיו רוני"></a>

  <main>
    <p class="kicker">הטופס שוגר</p>
    <h1 class="title">יצאנו לדרך</h1>
    <p class="note">אני חוזרת אלייך תוך יום עסקים אחד. אם זה דחוף, הכי מהר זה בוואטסאפ.</p>
    <div class="cta">
      <a class="btn solid" href="https://wa.me/972502463500" target="_blank" rel="noopener">
        <i class="ic"></i>דברו איתי
      </a>
      <a class="btn line" href="/">חזרה לאתר</a>
    </div>
  </main>
</body>
</html>
