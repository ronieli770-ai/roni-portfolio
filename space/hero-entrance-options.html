<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אפשרויות כניסה להירו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0c;color:#fff;font-family:'IBM Plex Sans Hebrew',sans-serif;min-height:100vh;display:flex;flex-direction:column}

  .bar{display:flex;gap:10px;align-items:center;padding:14px 18px;background:#111;border-bottom:1px solid #222;flex-wrap:wrap}
  .bar b{font-weight:600;font-size:14px;color:#8da8cb;margin-left:6px}
  .opt{
    padding:9px 16px;border-radius:8px;border:1px solid #333;background:#1a1a1e;color:#ccc;
    font-family:inherit;font-size:14px;cursor:pointer;transition:all .2s;
  }
  .opt:hover{border-color:#fa9154;color:#fff}
  .opt.on{background:linear-gradient(to left,#e0783c,#fa9154);color:#fff;border-color:transparent;font-weight:600}
  .replay{margin-inline-start:auto;padding:9px 18px;border-radius:8px;border:1px solid #fa9154;background:transparent;color:#fa9154;font-family:inherit;font-size:14px;cursor:pointer}
  .replay:hover{background:rgba(250,145,84,.12)}

  .frame{flex:1;position:relative;overflow:hidden;background:#000}

  /* ---- the mock hero ---- */
  .hero{position:absolute;inset:0;overflow:hidden}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
  .title{
    position:absolute;left:50%;top:16%;transform:translateX(-50%);
    width:92%;text-align:center;font-size:clamp(26px,4.6vw,64px);line-height:1.15;color:#fff;
    text-shadow:0 2px 30px rgba(0,0,0,.5);white-space:nowrap;
  }
  .title .l1{font-weight:400;display:block}
  .title .l2{font-weight:700;display:block}
  .btns{position:absolute;left:44px;bottom:50px;display:flex;gap:14px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    width:160px;height:58px;border-radius:10px;font-size:19px;font-weight:600;color:#fff;text-decoration:none;
  }
  .btn.solid{background:linear-gradient(to left,#e0783c,#fa9154)}
  .btn.line{border:1px solid #e0783c;color:#fa9154}
  .status{
    position:absolute;right:44px;bottom:50px;padding:14px 20px;border-radius:12px;
    background:rgba(10,14,24,.55);border:1px solid rgba(141,168,203,.25);backdrop-filter:blur(8px);
    font-size:13px;line-height:1.7;color:#c9b48a;text-align:right;
  }
  .blackout{position:absolute;inset:0;background:#000;pointer-events:none}

  /* halves used by option 3 (hatch) */
  .hatch-top,.hatch-bot{position:absolute;left:0;right:0;height:50%;background:#000;pointer-events:none;visibility:hidden}
  .hatch-top{top:0}
  .hatch-bot{bottom:0}
  .run-3 .hatch-top,.run-3 .hatch-bot{visibility:visible}

  /* glitch clones used by option 1 */
  .title .ghost{position:absolute;inset:0;color:#fff;pointer-events:none;opacity:0}
  .title .ghost.t{clip-path:inset(0 0 50% 0)}
  .title .ghost.b{clip-path:inset(50% 0 0 0)}

  /* =========== option 1: glitch handoff =========== */
  .run-1 .blackout{animation:o1-black .5s steps(1,end) forwards}
  @keyframes o1-black{0%{opacity:1}55%{opacity:1}100%{opacity:0}}
  .run-1 .hero video{opacity:0;animation:o1-video 1s ease .45s forwards}
  @keyframes o1-video{to{opacity:1}}
  .run-1 .title{opacity:0;animation:o1-flicker .55s steps(1,end) .1s forwards;text-shadow:0 0 24px rgba(141,168,203,.8)}
  @keyframes o1-flicker{0%{opacity:1}8%{opacity:.15}16%{opacity:1}26%{opacity:.2}34%{opacity:1}100%{opacity:1;text-shadow:0 2px 30px rgba(0,0,0,.5)}}
  .run-1 .title .ghost.t{animation:o1-tear-t .55s steps(1,end) .1s}
  .run-1 .title .ghost.b{animation:o1-tear-b .55s steps(1,end) .1s}
  @keyframes o1-tear-t{0%{opacity:1;transform:translate(14px,0)}20%{opacity:1;transform:translate(-11px,0)}40%{opacity:.9;transform:translate(8px,0)}60%{opacity:.5;transform:translate(-4px,0)}80%,100%{opacity:0;transform:none}}
  @keyframes o1-tear-b{0%{opacity:1;transform:translate(-13px,0)}20%{opacity:1;transform:translate(10px,0)}40%{opacity:.9;transform:translate(-7px,0)}60%{opacity:.5;transform:translate(4px,0)}80%,100%{opacity:0;transform:none}}
  .run-1 .btns,.run-1 .status{opacity:0;animation:o1-in .7s ease .9s forwards}
  @keyframes o1-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* =========== option 2: launch =========== */
  .run-2 .blackout{animation:o2-black .8s ease forwards}
  @keyframes o2-black{from{opacity:1}to{opacity:0}}
  .run-2 .title .l1{opacity:0;animation:o2-rise .8s cubic-bezier(.16,1,.3,1) .35s forwards}
  .run-2 .title .l2{opacity:0;animation:o2-rise .8s cubic-bezier(.16,1,.3,1) .55s forwards}
  @keyframes o2-rise{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:none}}
  .run-2 .btns{opacity:0;animation:o2-rise .8s cubic-bezier(.16,1,.3,1) .85s forwards}
  .run-2 .status{opacity:0;animation:o2-status .6s ease 1.15s forwards}
  @keyframes o2-status{0%{opacity:0}30%{opacity:.7}45%{opacity:.2}60%{opacity:.85}100%{opacity:1}}

  /* =========== option 3: hatch =========== */
  .run-3 .blackout{display:none}
  .run-3 .hatch-top{animation:o3-top 1.1s cubic-bezier(.7,0,.2,1) .15s forwards}
  .run-3 .hatch-bot{animation:o3-bot 1.1s cubic-bezier(.7,0,.2,1) .15s forwards}
  @keyframes o3-top{to{transform:translateY(-100%)}}
  @keyframes o3-bot{to{transform:translateY(100%)}}
  .run-3 .title{opacity:0;animation:o3-glow 1s ease .75s forwards}
  @keyframes o3-glow{0%{opacity:0;text-shadow:0 0 34px rgba(141,168,203,1)}45%{opacity:1;text-shadow:0 0 26px rgba(141,168,203,.85)}100%{opacity:1;text-shadow:0 2px 30px rgba(0,0,0,.5)}}
  .run-3 .btns,.run-3 .status{opacity:0;animation:o1-in .7s ease 1.25s forwards}

  /* =========== option 4: settle =========== */
  .run-4 .hero{animation:o4-settle 1.6s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes o4-settle{from{opacity:0;transform:scale(1.15);filter:blur(7px)}30%{opacity:1}to{opacity:1;transform:none;filter:none}}
  .run-4 .blackout{display:none}
  .run-4 .btns,.run-4 .status{opacity:0;animation:o1-in .8s ease 1.1s forwards}

  @media (max-width:700px){
    .title{white-space:normal}
    .btns{left:14px;bottom:110px}
    .btn{width:132px;height:50px;font-size:16px}
    .status{right:14px;bottom:24px;font-size:11px}
  }
</style>
</head>
<body>

<div class="bar">
  <b>אנימציית כניסה להירו:</b>
  <button class="opt on" data-o="1">1 · מסירת גליץ'</button>
  <button class="opt" data-o="2">2 · שיגור</button>
  <button class="opt" data-o="3">3 · פתיחת צוהר</button>
  <button class="opt" data-o="4">4 · התייצבות</button>
  <button class="replay" id="replay">▶ הרץ שוב</button>
</div>

<div class="frame" id="frame">
  <div class="hero">
    <video src="0.mp4" autoplay loop muted playsinline></video>
    <h1 class="title">
      <span class="ghost t" aria-hidden="true"><span class="l1">אתרים שגורמים לעסק שלכם</span><span class="l2">להיראות ראשון בתחום</span></span>
      <span class="ghost b" aria-hidden="true"><span class="l1">אתרים שגורמים לעסק שלכם</span><span class="l2">להיראות ראשון בתחום</span></span>
      <span class="l1">אתרים שגורמים לעסק שלכם</span>
      <span class="l2">להיראות ראשון בתחום</span>
    </h1>
    <div class="btns">
      <a class="btn solid" href="#" onclick="return false">בואו נדבר</a>
      <a class="btn line" href="#" onclick="return false">לתיק עבודות</a>
    </div>
    <div class="status">סטטוס: מוכן לשיגור<br>גובה: 0 מ'<br>מהירות: 0 קמ"ש</div>
  </div>
  <div class="hatch-top"></div>
  <div class="hatch-bot"></div>
  <div class="blackout"></div>
</div>

<script>
  const frame = document.getElementById('frame');
  let cur = '1';
  function run(o){
    cur = o;
    frame.className = 'frame';
    void frame.offsetWidth;               // restart the animations
    frame.classList.add('run-' + o);
    const v = frame.querySelector('video');
    v.currentTime = 0; v.play().catch(() => {});
  }
  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b));
    run(b.dataset.o);
  }));
  document.getElementById('replay').addEventListener('click', () => run(cur));
  run('1');
</script>
</body>
</html>
