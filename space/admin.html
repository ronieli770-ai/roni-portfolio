<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>פניות מהאתר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d18; --card:#141a2e; --line:#242c45; --ink:#eef1f8; --dim:#8b95b0;
    --accent:#FA9154; --accent-2:#E0783C; --ok:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans Hebrew',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

  /* ---------- gate ---------- */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{
    width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:30px 26px;
  }
  .gate-card h1{margin:0 0 4px;font-size:22px;font-weight:600}
  .gate-card p{margin:0 0 22px;color:var(--dim);font-size:14px}
  label{display:block;margin:0 0 6px;font-size:13px;color:var(--dim)}
  input[type=email],input[type=password],input[type=search],textarea{
    width:100%;background:#0e1424;border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;color:var(--ink);font-family:inherit;font-size:15px;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .field{margin:0 0 16px}
  button{
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    border:0;border-radius:9px;padding:11px 18px;color:#fff;
    background:linear-gradient(to left,var(--accent-2),var(--accent));
  }
  button:disabled{opacity:.55;cursor:default}
  button.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:500}
  .err{margin:14px 0 0;color:#ff8080;font-size:14px;min-height:20px}

  /* ---------- head ---------- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 22px}
  header h1{margin:0;font-size:24px;font-weight:600}
  .count{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:5px 13px;font-size:13px;color:var(--dim)
  }
  .count b{color:var(--accent);font-weight:600}
  .spacer{margin-inline-start:auto}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
  .tools input[type=search]{max-width:280px}

  /* ---------- cards ---------- */
  .lead{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin:0 0 12px;
  }
  .lead.done{opacity:.5}
  .lead-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .who{font-size:18px;font-weight:600}
  .when{color:var(--dim);font-size:13px}
  .phone{
    color:var(--accent);text-decoration:none;font-weight:600;
    font-variant-numeric:tabular-nums;direction:ltr;display:inline-block
  }
  .phone:hover{text-decoration:underline}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px;margin:14px 0 0;align-items:start;
  }
  .cell{align-self:start}
  .cell .k{color:var(--dim);font-size:12px;margin:0 0 3px}
  .cell .v{white-space:pre-wrap;overflow-wrap:anywhere}
  .row-actions{display:flex;gap:10px;align-items:center;margin:16px 0 0;flex-wrap:wrap}
  .check{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:14px;cursor:pointer;user-select:none}
  .check input{width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
  .empty{color:var(--dim);text-align:center;padding:60px 0}
  .hidden{display:none}
</style>
</head>
<body>

<!-- ---------- sign in ---------- -->
<div id="gate">
  <form class="gate-card" id="gate-form">
    <h1>פניות מהאתר</h1>
    <p>העמוד פרטי. התחברי כדי לראות את הפניות.</p>
    <div class="field">
      <label for="em">אימייל</label>
      <input id="em" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="pw">סיסמה</label>
      <input id="pw" type="password" autocomplete="current-password" required>
    </div>
    <button id="go" type="submit">כניסה</button>
    <p class="err" id="gate-err"></p>
  </form>
</div>

<!-- ---------- the leads ---------- -->
<div class="wrap hidden" id="app">
  <header>
    <h1>פניות מהאתר</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="ghost" id="refresh" type="button">רענון</button>
    <button class="ghost" id="out" type="button">יציאה</button>
  </header>

  <div class="tools">
    <input type="search" id="q" placeholder="חיפוש לפי שם, טלפון או עסק">
    <label class="check"><input type="checkbox" id="only-new"> רק שלא טופלו</label>
  </div>

  <div id="list"></div>
</div>

<script>
/* The public key below is meant to sit in a page - on its own it opens
   nothing. The rows are guarded in the database, which hands leads only to a
   signed in session belonging to the site's owner. */
const DB  = 'https://mgnvvtevbzepxnbkekpv.supabase.co';
const KEY = 'sb_publishable_BBieDuoczGZv9xduZ85t1A_WChRapHf';

const $ = s => document.querySelector(s);
const store = {
  get: () => { try { return JSON.parse(localStorage.getItem('roni-admin') || 'null'); } catch (e) { return null; } },
  set: s  => localStorage.setItem('roni-admin', JSON.stringify(s)),
  clear:() => localStorage.removeItem('roni-admin'),
};

let session = store.get();
let leads = [];

/* ---------- talking to the database ---------- */

async function auth(path, body) {
  const r = await fetch(`${DB}/auth/v1/${path}`, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'failed');
  return data;
}

/* a session that has aged out is renewed once, quietly, before giving up */
async function api(path, opts = {}, retry = true) {
  const r = await fetch(`${DB}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: KEY,
      Authorization: `Bearer ${session.access_token}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });

  if (r.status === 401 && retry && session.refresh_token) {
    try {
      session = await auth('token?grant_type=refresh_token', { refresh_token: session.refresh_token });
      store.set(session);
      return api(path, opts, false);
    } catch (e) { signOut(); throw e; }
  }
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

/* ---------- screens ---------- */

function signOut() {
  store.clear();
  session = null;
  $('#app').classList.add('hidden');
  $('#gate').classList.remove('hidden');
}

function enter() {
  $('#gate').classList.add('hidden');
  $('#app').classList.remove('hidden');
  load();
}

$('#gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#go');
  btn.disabled = true;
  $('#gate-err').textContent = '';
  try {
    session = await auth('token?grant_type=password', {
      email: $('#em').value.trim(),
      password: $('#pw').value,
    });
    store.set(session);
    $('#pw').value = '';
    enter();
  } catch (err) {
    $('#gate-err').textContent = 'האימייל או הסיסמה לא נכונים';
  } finally {
    btn.disabled = false;
  }
});

$('#out').addEventListener('click', signOut);
$('#refresh').addEventListener('click', load);
$('#q').addEventListener('input', render);
$('#only-new').addEventListener('change', render);

/* ---------- the list ---------- */

async function load() {
  $('#list').innerHTML = '<p class="empty">טוען...</p>';
  try {
    leads = await api('leads?select=*&order=created_at.desc');
    render();
  } catch (err) {
    $('#list').innerHTML = '<p class="empty">לא הצלחתי לטעון את הפניות</p>';
  }
}

const esc = v => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const when = iso => new Date(iso).toLocaleString('he-IL',
  { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

/* israeli mobile numbers reach whatsapp in international form */
const wa = p => '972' + String(p).replace(/\D/g,'').replace(/^0/,'');

const cell = (k, v) => v
  ? `<div class="cell"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`
  : '';

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const onlyNew = $('#only-new').checked;

  const shown = leads.filter(l => {
    if (onlyNew && l.handled) return false;
    if (!q) return true;
    return [l.name, l.phone, l.business, l.field, l.goal]
      .some(v => v && String(v).toLowerCase().includes(q));
  });

  const open = leads.filter(l => !l.handled).length;
  $('#count').innerHTML = `<b>${open}</b> ממתינות, ${leads.length} בסך הכל`;

  $('#list').innerHTML = shown.length ? shown.map(l => `
    <article class="lead ${l.handled ? 'done' : ''}" data-id="${l.id}">
      <div class="lead-top">
        <span class="who">${esc(l.name)}</span>
        <a class="phone" href="https://wa.me/${wa(l.phone)}" target="_blank" rel="noopener">${esc(l.phone)}</a>
        <span class="spacer"></span>
        <span class="when">${when(l.created_at)}</span>
      </div>
      <div class="grid">
        ${cell('שם העסק או אתר קיים', l.business)}
        ${cell('תחום העסק', l.field)}
        ${cell('יעד האתר', l.goal)}
      </div>
      <div class="row-actions">
        <label class="check">
          <input type="checkbox" class="mark" ${l.handled ? 'checked' : ''}> טופל
        </label>
      </div>
    </article>`).join('')
    : '<p class="empty">אין פניות להצגה</p>';

  document.querySelectorAll('.mark').forEach(box => {
    box.addEventListener('change', async e => {
      const card = e.target.closest('.lead');
      const id = card.dataset.id;
      const handled = e.target.checked;
      card.classList.toggle('done', handled);
      const lead = leads.find(l => l.id === id);
      if (lead) lead.handled = handled;
      try {
        await api(`leads?id=eq.${id}`, {
          method: 'PATCH',
          headers: { Prefer: 'return=minimal' },
          body: JSON.stringify({ handled }),
        });
        render();
      } catch (err) {
        e.target.checked = !handled;
        card.classList.toggle('done', !handled);
      }
    });
  });
}

if (session && session.access_token) enter();
</script>
</body>
</html>
