<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עיצוב גרפי · סטודיו רוני</title>
<meta name="description" content="עיצוב גרפי ומיתוג - סטודיו רוני אליהו.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:#000;color:#fff;
    font-family:'IBM Plex Sans Hebrew',system-ui,-apple-system,sans-serif;
    font-weight:400;-webkit-font-smoothing:antialiased;
  }

  /* static background watermark - stays put while the page scrolls */
  .bg-mark{
    position:fixed;z-index:0;pointer-events:none;overflow:hidden;opacity:.07;
    width:51.56vw;height:132.59vh;
    left:96.73vw;top:50vh;transform:translate(-50%,-50%);
  }
  .bg-mark img{position:absolute;left:-415.58%;top:-35.94%;width:588.91%;height:170.31%;max-width:none;display:block}

  /* every section is exactly one screen tall, page scrolls normally */
  .gd-sec{position:relative;z-index:1;width:100%;height:100vh;height:100svh;overflow:hidden;background:transparent}

  /* ---------- section 1 - מיתוג ---------- */
  .gd-mark{
    position:absolute;left:calc(50% + 5.874vw);top:calc(50% + 0.045%);
    transform:translate(-50%,-50%);
    width:min(71px,4.109vw);aspect-ratio:71/118;overflow:hidden;pointer-events:none;
  }
  .gd-mark img{
    position:absolute;left:-415.58%;top:-35.94%;
    width:588.91%;height:170.31%;max-width:none;display:block;
  }
  .gd-word{
    position:absolute;top:46.55%;left:calc(50% - 2.922vw);transform:translateX(-50%);
    width:min(181px,10.47vw);text-align:center;white-space:nowrap;
    font-size:min(80px,4.63vw);font-weight:400;line-height:.85;color:#fff;
  }

  /* ---------- section 5 - מודעות גרפיות ---------- */
  .ga-mark{
    position:absolute;left:64.67%;top:calc(50% + 0.045%);
    transform:translate(-50%,-50%);
    width:min(71px,4.109vw);aspect-ratio:71/118;overflow:hidden;pointer-events:none;
  }
  .ga-mark img{
    position:absolute;left:-415.58%;top:-35.94%;
    width:588.91%;height:170.31%;max-width:none;display:block;
  }
  .ga-word{
    position:absolute;top:46.46%;right:39.18%;
    width:min(475px,27.49vw);text-align:right;white-space:nowrap;
    font-size:min(80px,4.63vw);font-weight:400;line-height:.85;color:#fff;
  }

  /* ---------- section 6 - dome gallery ---------- */
  .sphere-root{
    position:relative;width:100%;height:100%;
    --radius:520px;--viewer-pad:72px;
    --circ:calc(var(--radius) * 3.14);
    --rot-y:calc((360deg / var(--segments-x)) / 2);
    --rot-x:calc((360deg / var(--segments-y)) / 2);
    --item-width:calc(var(--circ) / var(--segments-x));
    --item-height:calc(var(--circ) / var(--segments-y));
  }
  .sphere-root *{box-sizing:border-box}
  .sphere,.item,.item__image{transform-style:preserve-3d}
  main.sphere-main{
    position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;background:transparent;cursor:grab;
  }
  main.sphere-main:active{cursor:grabbing}
  .stage{width:100%;height:100%;display:grid;place-items:center;perspective:calc(var(--radius) * 2);perspective-origin:50% 50%;contain:layout paint size}
  .sphere{transform:translateZ(calc(var(--radius) * -1));will-change:transform}
  .overlay,.overlay--blur{position:absolute;inset:0;margin:auto;z-index:3;pointer-events:none}
  .overlay{background-image:radial-gradient(rgba(235,235,235,0) 65%,var(--overlay-blur-color,#000) 100%)}
  .overlay--blur{
    -webkit-mask-image:radial-gradient(rgba(235,235,235,0) 70%,var(--overlay-blur-color,#000) 90%);
    mask-image:radial-gradient(rgba(235,235,235,0) 70%,var(--overlay-blur-color,#000) 90%);
    backdrop-filter:blur(3px);
  }
  .item{
    width:calc(var(--item-width) * var(--item-size-x));
    height:calc(var(--item-height) * var(--item-size-y));
    position:absolute;top:-999px;bottom:-999px;left:-999px;right:-999px;margin:auto;
    transform-origin:50% 50%;backface-visibility:hidden;transition:transform 300ms;
    transform:rotateY(calc(var(--rot-y) * (var(--offset-x) + ((var(--item-size-x) - 1) / 2)) + var(--rot-y-delta,0deg)))
      rotateX(calc(var(--rot-x) * (var(--offset-y) - ((var(--item-size-y) - 1) / 2)) + var(--rot-x-delta,0deg)))
      translateZ(var(--radius));
  }
  .item__image{
    position:absolute;display:block;inset:10px;border-radius:var(--tile-radius,12px);
    background:transparent;overflow:hidden;backface-visibility:hidden;transition:transform 300ms;
    cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;pointer-events:auto;transform:translateZ(0);
  }
  .item__image:focus{outline:none}
  .item__image:hover{transform:translateZ(0) scale(1.25);z-index:6}
  .item__image img{width:100%;height:100%;object-fit:cover;pointer-events:none;backface-visibility:hidden;filter:var(--image-filter,none)}
  .viewer{position:absolute;inset:0;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:var(--viewer-pad)}
  .viewer .frame{height:100%;aspect-ratio:1;border-radius:var(--enlarge-radius,32px);display:flex}
  @media (max-aspect-ratio:1/1){.viewer .frame{height:auto;width:100%}}
  .viewer .scrim{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.72);pointer-events:none;opacity:0;transition:opacity .5s ease;backdrop-filter:blur(8px)}
  .sphere-root[data-enlarging='true'] .viewer .scrim{opacity:1;pointer-events:all}
  .viewer .enlarge{position:absolute;z-index:30;border-radius:var(--enlarge-radius,32px);overflow:hidden;transform-origin:top left;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .viewer .enlarge img{width:100%;height:100%;object-fit:contain;filter:var(--image-filter,none)}
  .sphere-root .enlarge-closing img{filter:var(--image-filter,none)}
  .edge-fade{position:absolute;left:0;right:0;height:120px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--overlay-blur-color,#000))}
  .edge-fade--top{top:0;transform:rotate(180deg)}
  .edge-fade--bottom{bottom:0}
  .gd-sec[data-gd="6"] dome-gallery{position:absolute;inset:0}

  /* ---------- section 8 - גרפיקה לדפוס ---------- */
  .gd-sec[data-gd="8"]{display:flex;align-items:center;justify-content:center}
  .pr-rollup{position:absolute;left:10.36%;top:20.59%;width:24.36%;height:73.14%;border-radius:min(30px,1.74vw);overflow:hidden}
  .pr-rollup img{position:absolute;left:-38.6%;top:.04%;width:194.06%;height:100%;max-width:none;display:block}
  .pr-flyer{position:absolute;left:37.04%;top:20.32%;width:33.33%;height:36.08%;border-radius:min(30px,1.74vw);overflow:hidden}
  .pr-flyer img{width:100%;height:100%;object-fit:cover;display:block}
  .pr-billboard{position:absolute;left:37.04%;top:60.07%;width:39.87%;height:33.66%;border-radius:min(30px,1.74vw);overflow:hidden}
  .pr-billboard img{width:100%;height:100%;object-fit:cover;display:block}
  .pr-invite{position:absolute;left:63.77%;top:20.32%;width:41.03%;height:81.20%;pointer-events:none;z-index:3}
  .pr-invite img{width:100%;height:100%;object-fit:contain;display:block}

  #menu-overlay{
    position:fixed;inset:0;z-index:11;
    background:
      radial-gradient(ellipse 80% 70% at 85% 40%,rgba(60,95,149,.55) 0%,transparent 70%),
      radial-gradient(ellipse 90% 80% at 20% 90%,rgba(20,35,60,.9) 0%,transparent 60%),
      #060a14;
    opacity:0;visibility:hidden;
    transition:opacity .5s ease,visibility .5s ease;
    overflow:hidden;
  }
  #menu-overlay.open{opacity:1;visibility:visible}
  #menu-overlay.open ~ .rail{display:none}
  #menu-overlay.open ~ .wa-fab{display:none}
  #menu-overlay .mo-logo{display:none}
  #menu-overlay .mo-portraits{
    position:absolute;left:0;top:0;width:55%;height:100%;z-index:2;
  }
  #menu-overlay .mo-dark{
    position:absolute;left:8.5%;top:9.5%;width:min(826px,87%);height:auto;
    transition:opacity .5s ease;
  }
  #menu-overlay .mo-light{
    position:absolute;left:calc(4.7% - 30px);top:5.1%;width:min(920px,96.7%);height:auto;
    opacity:0;transition:opacity .5s ease;
  }
  #menu-overlay .mo-portraits:hover .mo-light{opacity:1;}
  #menu-overlay .mo-portraits:hover .mo-dark{opacity:0;}
  #menu-overlay .mo-earth{
    position:absolute;left:52%;top:65%;transform:translateX(-50%) rotate(90deg);width:min(2142px,124vw);height:auto;z-index:3;pointer-events:none;
  }
  #menu-overlay .mo-nav{
    position:absolute;left:71%;top:41%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:14px;z-index:4;
  }
  #menu-overlay .mo-nav a{
    font-size:clamp(34px,5.8vw,96px);font-weight:400;
    background:linear-gradient(to left,#8da8cb,#ffffff);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-decoration:none;letter-spacing:.02em;transition:opacity .3s ease;
    direction:rtl;line-height:1.18;white-space:nowrap;
  }
  .glitch{
    --glitch-bg:transparent; /* בלי רקע - תזוזה בלבד */
    --glitch-dur:.7s;        /* אורך הפרץ */
    --glitch-shift:3px;      /* עוצמת ההזזה לצדדים */

    position:relative;
    display:inline-block;
    color:inherit;
    border:0;
    padding:0;
    margin:0;
    cursor:pointer;
    text-decoration:none;
    -webkit-font-smoothing:antialiased;
  }
  .glitch::before,
  .glitch::after{
    content:attr(data-text);
    position:absolute;
    inset:0;
    color:inherit;                 /* בלי צבעים, אותו צבע כמו הטקסט */
    background:var(--glitch-bg);
    opacity:0;
    pointer-events:none;
  }
  /* הכפתורים בתפריט צבועים בגרדיאנט - הרצועות יורשות אותו בדיוק */
  #menu-overlay .mo-nav a.glitch::before,
  #menu-overlay .mo-nav a.glitch::after{
    background:linear-gradient(to left,#8da8cb,#ffffff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;direction:rtl;
  }

  /* המחלקה מתווספת ומוסרת ב-JS, ולכן הפרץ קורה פעם אחת */
  .glitch.is-glitching::before{
    opacity:1;
    clip-path:inset(14% 0 56% 0);
    animation:glitch-a var(--glitch-dur) steps(2,end) 1 both;
  }
  .glitch.is-glitching::after{
    opacity:1;
    clip-path:inset(60% 0 14% 0);
    animation:glitch-b var(--glitch-dur) steps(2,end) 1 both;
  }

  /* הרצועות מתפרקות חזק בהתחלה ונרגעות לאפס בסוף */
  @keyframes glitch-a{
    0%  {transform:translateX(calc(var(--glitch-shift) * -1))}
    15% {transform:translateX(calc(var(--glitch-shift) * .7))}
    30% {transform:translateX(calc(var(--glitch-shift) * -.8))}
    45% {transform:translateX(calc(var(--glitch-shift) * .45))}
    60% {transform:translateX(calc(var(--glitch-shift) * -.3))}
    78% {transform:translateX(calc(var(--glitch-shift) * .15))}
    100%{transform:translateX(0)}
  }
  @keyframes glitch-b{
    0%  {transform:translateX(var(--glitch-shift))}
    15% {transform:translateX(calc(var(--glitch-shift) * -.7))}
    30% {transform:translateX(calc(var(--glitch-shift) * .8))}
    45% {transform:translateX(calc(var(--glitch-shift) * -.45))}
    60% {transform:translateX(calc(var(--glitch-shift) * .3))}
    78% {transform:translateX(calc(var(--glitch-shift) * -.15))}
    100%{transform:translateX(0)}
  }

  .glitch:focus-visible{
    outline:2px solid currentColor;
    outline-offset:6px;
    border-radius:3px;
  }

  @media (prefers-reduced-motion:reduce){
    .glitch::before,.glitch::after{display:none}
    .glitch.is-glitching{opacity:.75;transition:opacity .2s}
  }
  #menu-overlay .mo-dots{
    display:flex;gap:40px;margin-top:28px;justify-content:center;direction:ltr;
  }
  #menu-overlay .mo-dots a{
    width:min(78px,5.4vw);height:min(78px,5.4vw);border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s ease,opacity .3s ease;
  }
  #menu-overlay .mo-dots a:hover{transform:translateY(-4px);opacity:.85}
  /* height:auto - the mail glyph is 30x24 and must not be forced into a square */
  #menu-overlay .mo-dots a img{width:44%;height:auto;display:block}


  /* ---------- section 9 - צרו קשר ---------- */

  .ct-panel{

  .ct-title{

    width:53.24%;text-align:center;white-space:nowrap;

    background:linear-gradient(to right,#8da8cb,#ffffff);

  }

    position:absolute;left:43.87%;top:55.60%;width:12.27%;height:5.82%;

  .ct-cta:hover{filter:brightness(1.08);transform:translateY(-2px)}

  .ct-saturn{
    position:absolute;left:8.33%;top:16.47%;width:23.85%;aspect-ratio:1;

  .ct-earth{

  .ct-earth div{width:71.25%;height:71.25%;transform:rotate(127.94deg)}
  .ct-saturn img,.ct-earth img{width:100%;height:100%;object-fit:contain;display:block}

  /* ---------- image lightbox ---------- */
  #gd-lightbox{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;transition:opacity .3s ease;cursor:zoom-out;
  }
  #gd-lightbox.on{display:flex}
  #gd-lightbox.vis{opacity:1}
  /* the frame carries the clicked card's own background, so a transparent
     png opens on its white card rather than floating on the black scrim */
  #gd-lightbox .lb-frame{
    max-width:92vw;max-height:88vh;border-radius:14px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 24px 90px rgba(0,0,0,.65);
  }
  #gd-lightbox .lb-frame.boxed{padding:5vmin}
  #gd-lightbox img{max-width:88vw;max-height:82vh;object-fit:contain;display:block}
  #gd-lightbox .lb-frame.boxed img{max-width:78vw;max-height:72vh}
  #gd-lb-close{
    position:absolute;top:22px;left:22px;width:44px;height:44px;border:0;border-radius:50%;
    background:rgba(255,255,255,.12);cursor:pointer;
  }
  #gd-lb-close::before,#gd-lb-close::after{
    content:'';position:absolute;left:50%;top:50%;width:18px;height:2px;background:#fff;margin:-1px 0 0 -9px;
  }
  #gd-lb-close::before{transform:rotate(45deg)}
  #gd-lb-close::after{transform:rotate(-45deg)}
  #gd-lb-close:hover{background:rgba(255,255,255,.24)}

  /* ---------- sticky site header ---------- */
  :root{--logo-w:min(170px,11vw);--hdr-top:clamp(16px,2.8vh,32px)}
  .logo{position:fixed;top:var(--hdr-top);left:2.2vw;width:var(--logo-w);z-index:20}
  .logo img{width:100%;display:block}
  /* the wordmark's ink is 57.42% of the logo file and centred in it, so the
     full-bleed burger is scaled to that ink and hung on the same centre:
     height = .75 of that ink, top = logo top + .1371 * logo width */
  .menu{position:fixed;top:calc(var(--hdr-top) + var(--logo-w) * 0.1371);right:2.2vw;z-index:20;width:calc(var(--logo-w) * 0.3034);aspect-ratio:79/54;cursor:pointer}
  /* three bars on a 79x54 box, the middle one nudged right by 7 */
  .menu i{position:absolute;display:block;background:#fff;width:91.14%;height:20.06%}
  .menu i:nth-child(1){left:0;top:0}
  .menu i:nth-child(2){left:8.86%;top:40.12%}
  .menu i:nth-child(3){left:0;top:79.94%}

  /* ---------- section 2 - מדריכים ב+ ---------- */
  /* the whole composition keeps the figma aspect ratio, so nothing stretches
     and no image inside a container gets cropped - it just letterboxes */
  .gd-sec[data-gd="2"],.gd-sec[data-gd="3"]{display:flex;align-items:center;justify-content:center}
  .gd-stage{
    position:relative;overflow:hidden;
    aspect-ratio:1728/1117;
    width:min(100%,calc(100vh * 1728 / 1117));
    width:min(100%,calc(100svh * 1728 / 1117));
  }
  .gp-card{position:absolute;left:79.21%;top:74.93%;width:11.86%;height:18.26%;border-radius:min(20px,1.16vw);background:#fff}

  .gp-swatches{position:absolute;left:40.56%;top:74.93%;width:36.92%;height:18.08%;border-radius:min(20px,1.16vw);overflow:hidden;display:flex;direction:ltr}

  .gp-sw1{background:#027f40}

  /* ---------- magic bento - spotlight + border glow + tilt + magnetism ---------- */
  .mb-card{
    --glow-x:50%;--glow-y:50%;--glow-intensity:0;--glow-radius:390px;
    transition:transform .18s ease-out,box-shadow .3s ease;
    transform-style:preserve-3d;
  }
  .mb-card{z-index:2}
  /* glow lives behind the card and bleeds outwards only - nothing inside */
  .mb-glow{
    position:absolute;pointer-events:none;z-index:1;
    border-radius:min(28px,1.6vw);
    filter:blur(16px);
    opacity:0;transition:opacity .3s ease;
  }

/* every mockup image opens full-screen; the dome gallery keeps its own viewer */
(() => {
  const lb = document.getElementById('gd-lightbox');
  const frame = lb.querySelector('.lb-frame');
  const pic = lb.querySelector('img');
  const open = img => {
    pic.src = img.currentSrc || img.src;
    /* an image on a painted card opens inside that card's background */
    const card = img.closest('.mb-card') || img.parentElement;
    const bg = card ? getComputedStyle(card).backgroundColor : '';
    const painted = bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent';
    frame.style.background = painted ? bg : 'none';
    frame.classList.toggle('boxed', painted);
    lb.classList.add('on');
    requestAnimationFrame(() => lb.classList.add('vis'));
    document.documentElement.style.overflow = 'hidden';
  };
  const close = () => {
    lb.classList.remove('vis');
    document.documentElement.style.overflow = '';
    setTimeout(() => { lb.classList.remove('on'); pic.src = ''; }, 300);
  };
  document.querySelectorAll('.gd-sec:not([data-gd="9"]) .gd-stage img').forEach(img => {
    img.addEventListener('click', () => open(img));
  });
  lb.addEventListener('click', close);
  addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('on')) close(); });
})();
</script>

<script>
(() => {
  const GROUPS = [
    { label: 'מיתוג', anchor: '#g-mitug' },
    { label: 'מודעות גרפיות', anchor: '#g-ads' },
    { label: 'גרפיקה לדפוס', anchor: '#g-print' },
    { label: 'צרו קשר', anchor: '#g-contact' }
  ];
  const rail = document.getElementById('rail');
  GROUPS.forEach(g => rail.insertAdjacentHTML('beforeend', '<b><span class="tip">' + g.label + '</span></b>'));
  const dots = [...rail.children];
  const setActive = n => dots.forEach((b, i) => b.classList.toggle('on', i === n));
  dots.forEach((b, i) => b.addEventListener('click', () => {
    const el = document.querySelector(GROUPS[i].anchor);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }));
  const onScroll = () => {
    let active = 0;
    GROUPS.forEach((g, i) => {
      const el = document.querySelector(g.anchor);
      if (el && el.getBoundingClientRect().top <= innerHeight * 0.5) active = i;
    });
    setActive(active);
  };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>

<script>
(() => {
  const RADIUS = 390;
  const stages = [...document.querySelectorAll('.gd-stage')];
  if (!stages.length) return;
  if (window.innerWidth <= 768 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const spot = document.createElement('div');
  spot.className = 'mb-spotlight';
  document.body.appendChild(spot);

  /* one glow layer per card, sitting behind it inside its own stage */
  const PAD = 18;
  const units = [];
  stages.forEach(stage => {
    [...stage.querySelectorAll('.mb-card')].forEach(card => {
      const glow = document.createElement('div');
      glow.className = 'mb-glow';
      stage.appendChild(glow);
      units.push({ stage, card, glow });
    });
  });
  const cards = units.map(u => u.card);
  const placeGlows = () => {
    units.forEach(u => {
      const s = u.stage.getBoundingClientRect();
      const r = u.card.getBoundingClientRect();
      u.glow.style.left = (r.left - s.left - PAD) + 'px';
      u.glow.style.top = (r.top - s.top - PAD) + 'px';
      u.glow.style.width = (r.width + PAD * 2) + 'px';
      u.glow.style.height = (r.height + PAD * 2) + 'px';
    });
  };
  placeGlows();
  addEventListener('resize', placeGlows);
  addEventListener('load', placeGlows);

  const proximity = RADIUS * 0.5;
  const fade = RADIUS * 0.75;

  addEventListener('mousemove', e => {
    let minD = Infinity;
    units.forEach(u => {
      const s = u.stage.getBoundingClientRect();
      const inside = e.clientX >= s.left && e.clientX <= s.right && e.clientY >= s.top && e.clientY <= s.bottom;
      if (!inside){
        u.glow.style.opacity = '0';
        return;
      }
      const r = u.card.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const d = Math.max(0, Math.hypot(e.clientX-cx, e.clientY-cy) - Math.max(r.width, r.height)/2);
      minD = Math.min(minD, d);
      let g = 0;
      if (d <= proximity) g = 1;
      else if (d <= fade) g = (fade - d) / (fade - proximity);
      u.glow.style.opacity = String(g);
      if (g > 0){
        const gx = e.clientX - r.left + PAD;
        const gy = e.clientY - r.top + PAD;
        u.glow.style.background = `radial-gradient(${RADIUS}px circle at ${gx}px ${gy}px,`
          + `rgba(255,255,255,.95) 0%,rgba(255,255,255,.5) 30%,transparent 62%)`;
      }
    });
    spot.style.left = e.clientX + 'px';
    spot.style.top = e.clientY + 'px';
    spot.style.opacity = String(
      minD <= proximity ? 0.8 :
      minD <= fade ? ((fade - minD) / (fade - proximity)) * 0.8 : 0
    );
  }, { passive:true });

  /* tilt + magnetism */
  cards.forEach(c => {
    c.addEventListener('mousemove', e => {
      const r = c.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const cx = r.width/2, cy = r.height/2;
      const rx = ((y - cy) / cy) * -10;
      const ry = ((x - cx) / cx) * 10;
      const mx = (x - cx) * 0.05, my = (y - cy) * 0.05;
      c.style.transform = `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translate3d(${mx.toFixed(1)}px,${my.toFixed(1)}px,0)`;
    }, { passive:true });
    c.addEventListener('mouseleave', () => { c.style.transform = ''; });
  });
})();
</script>

<script>
(() => {
  const btn = document.querySelector('.menu');
  const ov = document.getElementById('menu-overlay');
  if (!btn || !ov) return;
  btn.addEventListener('click', () => {
    /* the hover portrait is held in data-src - without this swap the
       dark one fades out onto an empty image and she vanishes */
    const lazy = ov.querySelector('img[data-src]');
    if (lazy){ lazy.src = lazy.dataset.src; lazy.removeAttribute('data-src'); }
    ov.classList.toggle('open');
    document.body.classList.toggle('menu-open', ov.classList.contains('open'));
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') ov.classList.remove('open'); });
  /* one-shot glitch burst on hover */
  document.querySelectorAll('.glitch').forEach(el => {
    el.addEventListener('mouseenter', () => {
      el.classList.remove('is-glitching');
      void el.offsetWidth;
      el.classList.add('is-glitching');
    });
    el.addEventListener('animationend', e => {
      if (e.target === el) el.classList.remove('is-glitching');
    });
  });
})();
</script>
